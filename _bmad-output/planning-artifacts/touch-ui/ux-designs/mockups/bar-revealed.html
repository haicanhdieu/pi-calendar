<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Key screen: Bar-Revealed</title>
<style>
/* Governs: DESIGN.md Layout & Spacing (Touch Bar), Components (Touch Bar, Gear icon);
   EXPERIENCE.md State Patterns (Bar-Revealed row), Interaction Primitives (Reveal) */
body { background:#333; display:flex; gap:40px; align-items:flex-start; justify-content:center; padding:40px; font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; }
.frame { width:320px; height:240px; background:#0a0a0a; position:relative; overflow:hidden; border:2px solid #222; }
.label { color:#ccc; font-size:12px; margin-bottom:8px; font-family:monospace; }
.col { text-align:center; }

/* Clock view content, frozen underneath the bar */
.time { position:absolute; top:52px; left:0; right:0; text-align:center; font-size:64px; font-weight:700; color:#3dff7a; text-shadow:0 0 8px rgba(61,255,122,0.5); }
.seconds { font-size:24px; color:#ffb238; vertical-align:baseline; }
.date-line { position:absolute; top:132px; left:0; right:0; text-align:center; font-size:12px; letter-spacing:2px; color:#ffb238; }

/* Touch Bar */
.bar { position:absolute; bottom:0; left:0; right:0; height:36px; background:#141414; display:flex; align-items:center; justify-content:center; border-top:1px solid #1e1e1e; }
.gear { width:20px; height:20px; }
.gear .tooth { fill:#ffb238; }
.gear .hole { fill:#0a0a0a; }
.gear-pressed .tooth { fill:#ffe9b8; }
</style>
</head>
